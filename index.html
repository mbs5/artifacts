<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Artifact Library</title>
<meta name="description" content="A personal library of research briefings, pages, and tools — organized by theme.">
<style>
  :root {
    --ink: #1a1a1a;
    --muted: #5c5c5c;
    --line: #e6e2d9;
    --paper: #fdfcf9;
    --accent: #1d4ed8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif;
    color: var(--ink);
    background: var(--paper);
    line-height: 1.65;
    font-size: 17px;
  }
  .wrap { max-width: 860px; margin: 0 auto; padding: 0 24px; }
  header.page { padding: 64px 0 8px; }
  header.page h1 { font-size: 2.2rem; margin: 0 0 10px; letter-spacing: -0.01em; }
  header.page p { color: var(--muted); margin: 0; font-size: 1.05rem; }
  h2.theme { font-size: 1.25rem; margin: 44px 0 16px; letter-spacing: -0.01em; }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
  .card {
    display: block;
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 20px;
    background: #fff;
    color: inherit;
    text-decoration: none;
    transition: border-color 0.15s ease, transform 0.15s ease;
  }
  .card:hover { border-color: var(--accent); text-decoration: none; transform: translateY(-1px); }
  .card h3 { margin: 0 0 8px; font-size: 1.08rem; letter-spacing: -0.005em; }
  .card p { margin: 0 0 10px; color: var(--muted); font-size: 0.95rem; }
  .card .date { font-size: 0.82rem; color: #999; }
  .empty { color: var(--muted); padding: 40px 0; }
  footer { border-top: 1px solid var(--line); margin-top: 64px; padding: 24px 0 64px; color: var(--muted); font-size: 0.9rem; }
  @media (max-width: 600px) {
    body { font-size: 16px; }
    header.page h1 { font-size: 1.7rem; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="page">
    <h1>Artifact Library</h1>
    <p>Research briefings, pages, and tools — organized by theme.</p>
  </header>

  <div id="library"><p class="empty">Loading…</p></div>

  <footer>
    <p>A living collection. New artifacts land here automatically.</p>
  </footer>
</div>

<script>
fetch('/artifacts.json')
  .then(r => r.json())
  .then(items => {
    const lib = document.getElementById('library');
    if (!items.length) {
      lib.innerHTML = '<p class="empty">Nothing here yet.</p>';
      return;
    }
    const themes = {};
    items.forEach(a => {
      (themes[a.theme] = themes[a.theme] || []).push(a);
    });
    lib.innerHTML = Object.keys(themes).sort().map(theme => `
      <h2 class="theme">${escapeHtml(theme)}</h2>
      <div class="cards">
        ${themes[theme].map(a => `
          <a class="card" href="${escapeHtml(a.path)}">
            <h3>${escapeHtml(a.title)}</h3>
            <p>${escapeHtml(a.description)}</p>
            <span class="date">${escapeHtml(a.created)}</span>
          </a>
        `).join('')}
      </div>
    `).join('');
  })
  .catch(() => {
    document.getElementById('library').innerHTML = '<p class="empty">Could not load the library index.</p>';
  });

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}
</script>
</body>
</html>
